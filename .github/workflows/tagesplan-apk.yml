name: Tagesplan APK
on:
  push:
    branches: [tagesplan-android]
    paths:
      - 'tagesplan/**'
      - '.github/workflows/tagesplan-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev gettext autopoint
          python -m pip install pip==25.3
          python -m pip install buildozer==1.5.0 'Cython==0.29.37' pillow
      - name: Prepare app icon and check Python
        working-directory: tagesplan
        run: |
          python -m py_compile main.py
          python - <<'PY'
          from PIL import Image, ImageDraw
          im = Image.new("RGB", (512,512), "#12483C")
          d = ImageDraw.Draw(im)
          d.rounded_rectangle((91,111,421,421), radius=42, fill="#FCFAF4")
          d.rounded_rectangle((91,111,421,190), radius=30, fill="#B7D0BC")
          for x in (167,345):
              d.rounded_rectangle((x-13,78,x+13,152), radius=13, fill="#FCFAF4")
          d.line([(163,295),(229,358),(353,230)], fill="#12483C", width=33, joint="curve")
          im.save("icon.png")
          PY
      - name: Prepare stable Android toolchain
        run: |
          git clone --depth 1 --branch v2026.05.09 https://github.com/kivy/python-for-android.git "$RUNNER_TEMP/p4a"
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "p4a/pythonforandroid/build.py"
          s = p.read_text()
          import re
          s, n = re.subn(r"shprint\(host_python, '-m', 'venv', 'venv'\)", "shprint(host_python, '-m', 'venv', '--clear', 'venv')", s)
          assert n == 1, "Expected venv creation not found"
          s, n = re.subn(r"(?m)^([ \t]*)info\('Upgrade pip to latest version'\)\n\1shprint\(sh\.bash, '-c', \(\n\s*[\"']source venv/bin/activate && pip install -U pip[\"']\n\s*\), _env=copy\.copy\(base_env\)\)\n", "", s)
          assert n == 1, "Expected pip upgrade not found"
          p.write_text(s)
          spec = Path("tagesplan/buildozer.spec")
          s = spec.read_text()
          s = s.replace("[app]", "[app]\np4a.source_dir = " + str(p.parent.parent), 1)
          spec.write_text(s)
          PY
      - name: Build Android APK
        working-directory: tagesplan
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          buildozer android debug
          mkdir -p apk-output
          cp bin/*.apk apk-output/Tagesplan.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Tagesplan-APK
          path: tagesplan/apk-output/Tagesplan.apk
          if-no-files-found: error
