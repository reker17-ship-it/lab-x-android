name: Build LAB X APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            python3-pip python3-venv \
            git zip unzip autoconf \
            automake libtool libltdl-dev pkg-config patch \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            build-essential

      - name: Install Buildozer
        run: |
          python3 -m venv "$HOME/buildenv"
          source "$HOME/buildenv/bin/activate"
          pip install buildozer==1.6.0 Cython==0.29.37 setuptools==80.10.2

      - name: Prepare python-for-android
        run: |
          git clone --depth 1 --branch v2026.05.09 https://github.com/kivy/python-for-android.git "$RUNNER_TEMP/python-for-android"
          git -C "$RUNNER_TEMP/python-for-android" apply "$GITHUB_WORKSPACE/.github/patches/p4a-pip-venv.patch"
          echo "APP_P4A_SOURCE_DIR=$RUNNER_TEMP/python-for-android" >> "$GITHUB_ENV"

      - name: Build Android APK
        run: |
          set -o pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          source "$HOME/buildenv/bin/activate"
          python -m py_compile main.py
          buildozer -v android release 2>&1 | tee "$RUNNER_TEMP/labx-build.log"
          buildozer -v android debug 2>&1 | tee -a "$RUNNER_TEMP/labx-build.log"

      - name: Report build errors
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/labx-build.log" ]]; then
            sed -E $'s/\x1b\\[[0-9;]*m//g' "$RUNNER_TEMP/labx-build.log" \
              | grep -Ei 'fatal error|\[error\]|error:|Traceback|failed to build|No module named|undefined reference|HTTP Error|FAILED:' \
              | cut -c1-400 | tail -35 || true
          fi

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: LAB-X-APK
          path: bin/*-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: LAB-X-unsigned-APK
          path: bin/*-release-unsigned.apk
          if-no-files-found: error

  android-smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: LAB-X-unsigned-APK
          path: apk

      - name: Sign the release APK for the emulator
        run: |
          tools="$ANDROID_HOME/build-tools/35.0.0"
          if [[ ! -x "$tools/apksigner" ]]; then
            sdkmanager 'build-tools;35.0.0'
          fi
          keytool -genkeypair -alias emulator -keyalg RSA -validity 2 \
            -dname 'CN=LAB X emulator test' -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/labx-test.p12" -storepass android
          "$tools"/zipalign -P 16 -f 4 apk/*-release-unsigned.apk "$RUNNER_TEMP/labx-aligned.apk"
          "$tools"/apksigner sign --ks "$RUNNER_TEMP/labx-test.p12" --ks-pass pass:android \
            --out "$RUNNER_TEMP/labx-test.apk" "$RUNNER_TEMP/labx-aligned.apk"
          "$tools"/apksigner verify "$RUNNER_TEMP/labx-test.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch LAB X on Android
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash .github/scripts/android-smoke-test.sh "$RUNNER_TEMP/labx-test.apk"
