name: Build LAB X APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            python3-pip python3-venv \
            git zip unzip autoconf \
            automake libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            build-essential

      - name: Install Buildozer
        run: |
          python3 -m venv "$HOME/buildenv"
          source "$HOME/buildenv/bin/activate"
          pip install --upgrade pip
          pip install buildozer "cython==0.29.36" setuptools

      - name: Configure icon
        run: |
          sed -i '/^icon.filename/d' buildozer.spec
          sed -i '/^\[app\]/a icon.filename = icon.png' buildozer.spec
          sed -i '/^android.accept_sdk_license/d' buildozer.spec
          sed -i '/^\[app\]/a android.accept_sdk_license = True' buildozer.spec

      - name: Build Android APK
        run: |
          source "$HOME/buildenv/bin/activate"
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LAB-X-APK
          path: bin/*.apk
